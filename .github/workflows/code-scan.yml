name: "Code Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Code Security
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
      with:
        languages: 'python'

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1

  static-scan:
    name: Static Scan (Bandit + Semgrep + pip-audit)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Install scanners
      run: pip install --quiet bandit semgrep pip-audit

    - name: Bandit (analyse statique Python)
      run: |
        bandit -r . -x ./.git,./.github -ll -f screen --exit-zero
        bandit -r . -x ./.git,./.github -f json -o bandit.json --exit-zero

    - name: Semgrep (regles communaute, sans token)
      run: semgrep scan --config=p/default --config=p/python --sarif --output=semgrep.sarif

    - name: pip-audit (dependances)
      run: |
        reqs=$(git ls-files | grep -E '(^|/)requirements.*\.txt$' || true)
        if [ -z "$reqs" ]; then
          echo "Aucun fichier requirements*.txt suivi par git - etape ignoree."
          exit 0
        fi
        for f in $reqs; do
          echo "=== $f ==="
          pip-audit -r "$f" || true
        done

    - name: Publier les rapports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: security-reports
        path: |
          bandit.json
          semgrep.sarif
        if-no-files-found: warn
